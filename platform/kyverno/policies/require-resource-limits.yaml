---
# Kyverno Policy: Require resource requests and limits on all containers
# Without limits, one bad deployment can OOM the entire node.

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require Resource Limits
    policies.kyverno.io/category: Platform Standards
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      All containers must specify CPU and memory requests and limits.
      This prevents resource starvation and noisy-neighbor problems.
spec:
  validationFailureAction: audit  # Change to 'enforce' to block

  background: true

  rules:
    - name: require-limits
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaceSelector:
                matchExpressions:
                  - key: kubernetes.io/metadata.name
                    operator: NotIn
                    values:
                      - kube-system
                      - kube-public
                      - argocd
                      - cert-manager
                      - ingress-nginx
                      - kyverno
                      - monitoring
                      - vault
                      - harbor
                      - minio
                      - nats
                      - openfaas
                      - openfaas-fn
      validate:
        message: "All containers must specify resources.requests and resources.limits for cpu and memory"
        foreach:
          - list: "request.object.spec.containers"
            pattern:
              resources:
                requests:
                  memory: "?*"
                  cpu: "?*"
                limits:
                  memory: "?*"
                  cpu: "?*"
