---
# Kyverno Policy: Require standard labels on all pods
# Applies to all app namespaces (*-dev, *-staging, *-prod)
# Excludes platform namespaces (see kyverno/values.yaml)

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-labels
  annotations:
    policies.kyverno.io/title: Require Standard Labels
    policies.kyverno.io/category: Platform Standards
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      All pods must have the standard labels: app.kubernetes.io/name,
      app.kubernetes.io/version, and team. These labels enable
      Prometheus metric labeling, cost allocation, and incident routing.
spec:
  validationFailureAction: audit  # Change to 'enforce' to block

  background: true

  rules:
    - name: require-app-labels
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaceSelector:
                matchExpressions:
                  - key: kubernetes.io/metadata.name
                    operator: NotIn
                    values:
                      - kube-system
                      - kube-public
                      - argocd
                      - cert-manager
                      - ingress-nginx
                      - kyverno
                      - monitoring
                      - vault
                      - harbor
                      - minio
                      - nats
                      - openfaas
                      - openfaas-fn
      validate:
        message: "Pod must have labels: app.kubernetes.io/name, app.kubernetes.io/version, and team"
        pattern:
          metadata:
            labels:
              app.kubernetes.io/name: "?*"
              app.kubernetes.io/version: "?*"
              team: "?*"
