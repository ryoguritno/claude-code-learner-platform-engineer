# NATS JetStream Helm values (chart: nats-io/nats v1.1.5)

config:
  cluster:
    enabled: false  # Single node for local dev

  jetstream:
    enabled: true

    fileStore:
      enabled: true
      pvc:
        enabled: true
        size: 5Gi

    memoryStore:
      enabled: true
      maxSize: 1Gi

container:
  image:
    tag: "2.10.7-alpine"
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

promExporter:
  enabled: true
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack

natsBox:
  enabled: true
  container:
    image:
      tag: "0.14.2"
