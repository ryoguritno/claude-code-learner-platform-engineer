# NATS JetStream Helm values (chart: nats-io/nats v1.x)

config:
  cluster:
    enabled: false  # Single node for local dev

  jetstream:
    enabled: true
    memStore:
      enabled: true
      size: 1Gi
    fileStore:
      enabled: true
      size: 5Gi
      storageDirectory: /data

container:
  image:
    tag: "2.10.7-alpine"

  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

promExporter:
  enabled: true
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack

natsBox:
  enabled: true
  container:
    image:
      tag: "0.14.2"
