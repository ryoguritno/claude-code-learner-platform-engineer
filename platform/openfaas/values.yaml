# OpenFaaS Helm values

functionNamespace: openfaas-fn

operator:
  create: true

gateway:
  replicas: 1
  image: ghcr.io/openfaas/gateway:0.27.2
  readTimeout: "65s"
  writeTimeout: "65s"
  upstreamTimeout: "60s"
  resources:
    requests:
      memory: "120Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
    hosts:
      - host: openfaas.local.dev
        serviceName: gateway
        servicePort: 8080
        path: /
    tls:
      - secretName: local-dev-wildcard-tls
        hosts:
          - openfaas.local.dev

faasnetes:
  imagePullPolicy: "IfNotPresent"
  resources:
    requests:
      memory: "120Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"

# Prometheus integration
prometheus:
  create: true
  resources:
    requests:
      memory: "512Mi"
    limits:
      memory: "1Gi"

alertmanager:
  create: false  # Use kube-prometheus-stack's AlertManager

# Basic auth for gateway
basic_auth: true
generateBasicAuth: true

# Harbor registry credentials for functions
registrySecret: harbor-registry-credentials
