# HashiCorp Vault Helm values for local platform

global:
  enabled: true

injector:
  enabled: true
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"

server:
  # Dev mode: auto-unseal, in-memory storage, root token = dev-root-token
  # DO NOT use dev mode in production
  dev:
    enabled: true
    devRootToken: "dev-root-token"

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    hosts:
      - host: vault.local.dev
        paths:
          - /
    tls:
      - secretName: local-dev-wildcard-tls
        hosts:
          - vault.local.dev

  # UI
  ui:
    enabled: true

  # Service monitor for Prometheus
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack

ui:
  enabled: true
  serviceType: ClusterIP
