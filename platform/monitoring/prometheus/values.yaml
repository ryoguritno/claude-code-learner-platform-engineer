# kube-prometheus-stack Helm values

# Grafana is managed separately in grafana/values.yaml
# but kube-prometheus-stack includes it — we configure it here too

grafana:
  enabled: true
  adminPassword: "prom-operator"
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.local.dev
    tls:
      - secretName: local-dev-wildcard-tls
        hosts:
          - grafana.local.dev
  persistence:
    enabled: false  # For local dev — dashboards are GitOps-managed
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
    datasources:
      enabled: true
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki:3100
      access: proxy
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

prometheus:
  prometheusSpec:
    retention: 7d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    resources:
      requests:
        cpu: "200m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "2Gi"
    # Scrape from all namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector:
      matchLabels: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorNamespaceSelector:
      matchLabels: {}
    # Additional scrape configs
    additionalScrapeConfigs: []

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"

# Node exporter — metrics for each node
nodeExporter:
  enabled: true

# kube-state-metrics — Kubernetes object metrics
kubeStateMetrics:
  enabled: true

# Custom alert rules
additionalPrometheusRulesMap:
  platform-alerts:
    groups:
      - name: platform
        rules:
          - alert: PodCrashLooping
            expr: rate(kube_pod_container_status_restarts_total[15m]) * 60 * 5 > 5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.pod }} is crash-looping"
              description: "{{ $labels.pod }} in {{ $labels.namespace }} has restarted {{ $value }} times"

          - alert: NodeMemoryHigh
            expr: |
              (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Node memory usage above 85%"

          - alert: PersistentVolumeFillingUp
            expr: |
              (kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes) < 0.15
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "PV {{ $labels.persistentvolumeclaim }} is 85% full"
